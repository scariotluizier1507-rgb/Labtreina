<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funcionários - TREINACCGL</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    margin: 0;
}
header {
    background: #006633;
    color: white;
    padding: 20px;
    text-align: center;
}
.container {
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}
button {
    background: #006633;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
}
table {
    width: 100%;
    margin-top: 20px;
    background: white;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #ddd;
    padding: 10px;
}
</style>
</head>
<body>
<header>
<h1>TREINACCGL</h1>
<p>Cadastro de Funcionários</p>
</header>
<div class="container">
<div class="card">
<h2>Novo Funcionário</h2>
<input type="text" id="nome" placeholder="Nome completo">
<input type="text" id="matricula" placeholder="Matrícula">
<input type="text" id="cargo" placeholder="Cargo">
<select id="setor">
<option value="">Selecione o setor</option>
<option>Laboratório</option>
<option>Produção</option>
<option>Qualidade</option>
<option>Manutenção</option>
</select>
<button onclick="cadastrarFuncionario()">
Cadastrar
</button>
</div>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Matrícula</th>
<th>Cargo</th>
<th>Setor</th>
</tr>
</thead>
<tbody id="listaFuncionarios">
</tbody>
</table>
</div>
<script>
function cadastrarFuncionario(){
let nome = document.getElementById("nome").value;
let matricula = document.getElementById("matricula").value;
let cargo = document.getElementById("cargo").value;
let setor = document.getElementById("setor").value;
let tabela = document.getElementById("listaFuncionarios");
let linha = tabela.insertRow();
linha.insertCell(0).innerHTML = nome;
linha.insertCell(1).innerHTML = matricula;
linha.insertCell(2).innerHTML = cargo;
linha.insertCell(3).innerHTML = setor;
alert("Funcionário cadastrado com sucesso!");
}
</script>
</body>
</html>
