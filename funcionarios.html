<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TREINACCGL - Funcionários</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
}


.header{
    background:#003b5c;
    color:white;
    padding:20px;
    text-align:center;
}


.container{
    max-width:1100px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,0.1);
}


h2{
    color:#003b5c;
}


.formulario{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

}


input, select{

padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;

}


button{

background:#0077b6;
color:white;
border:none;
padding:12px 25px;
border-radius:6px;
cursor:pointer;
font-size:15px;

}


button:hover{

background:#005f8f;

}


table{

width:100%;
border-collapse:collapse;
margin-top:30px;

}


th{

background:#003b5c;
color:white;
padding:12px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


.status{

color:green;
font-weight:bold;

}


</style>


</head>


<body>


<div class="header">

<h1>TREINACCGL</h1>

<p>Gestão de Funcionários</p>

</div>



<div class="container">


<h2>Cadastro de Funcionário</h2>


<div class="formulario">


<input id="nome" placeholder="Nome completo">

<input id="matricula" placeholder="Matrícula">

<input id="cargo" placeholder="Cargo">

<input id="setor" placeholder="Setor">


<select id="turno">

<option value="">Selecione o turno</option>

<option>1º Turno</option>

<option>2º Turno</option>

<option>3º Turno</option>

</select>


<input id="email" placeholder="E-mail">


<select id="status">

<option value="Ativo">Ativo</option>

<option value="Inativo">Inativo</option>

</select>



</div>



<br>


<button onclick="salvarFuncionario()">

Salvar Funcionário

</button>



<h2>Funcionários cadastrados</h2>



<table>


<thead>

<tr>

<th>Nome</th>

<th>Matrícula</th>

<th>Cargo</th>

<th>Setor</th>

<th>Turno</th>

<th>Status</th>

</tr>


</thead>



<tbody id="listaFuncionarios">


</tbody>



</table>



</div>



<script src="js/funcionarios.js"></script>


</body>

</html>
