<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funcionários - TREINACCGL</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    margin: 0;
}
header {
    background: #006633;
    color: white;
    text-align: center;
    padding: 20px;
}
.container {
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}
button {
    background: #006633;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}
table {
    width: 100%;
    background: white;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}
</style>
</head>
<body>
<header>
<h1>TREINACCGL</h1>
<p>Cadastro de Funcionários</p>
</header>
<div class="container">
<div class="card">
<h2>Novo Funcionário</h2>
<input id="nome" placeholder="Nome completo">
<input id="matricula" placeholder="Matrícula">
<input id="cargo" placeholder="Cargo">
<select id="setor">
<option value="">Selecione o setor</option>
<option>Laboratório</option>
<option>Produção</option>
<option>Qualidade</option>
<option>Manutenção</option>
</select>
<button onclick="cadastrarFuncionario()">

Cadastrar funcionário

</button>
</div>
<div class="card">
<h2>Funcionários cadastrados</h2>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Matrícula</th>
<th>Cargo</th>
<th>Setor</th>
</tr>
</thead>
<tbody id="listaFuncionarios">
</tbody>
</table>
</div>
<button onclick="voltar()">

Voltar ao painel

</button>
</div>
<script>
let funcionarios = JSON.parse(localStorage.getItem("funcionarios")) || [];
mostrarFuncionarios();
function cadastrarFuncionario(){
let nome = document.getElementById("nome").value;
let matricula = document.getElementById("matricula").value;
let cargo = document.getElementById("cargo").value;
let setor = document.getElementById("setor").value;
if(!nome || !matricula || !cargo || !setor){
alert("Preencha todos os campos!");
return;
}
funcionarios.push({
nome,
matricula,
cargo,
setor
});
localStorage.setItem(
"funcionarios",
JSON.stringify(funcionarios)
);
mostrarFuncionarios();
alert("Funcionário cadastrado com sucesso!");
document.getElementById("nome").value="";
document.getElementById("matricula").value="";
document.getElementById("cargo").value="";
document.getElementById("setor").value="";
}
function mostrarFuncionarios(){
let tabela = document.getElementById("listaFuncionarios");
tabela.innerHTML="";
funcionarios.forEach(function(f){
let linha = tabela.insertRow();
linha.insertCell(0).innerHTML=f.nome;
linha.insertCell(1).innerHTML=f.matricula;
linha.insertCell(2).innerHTML=f.cargo;
linha.insertCell(3).innerHTML=f.setor;
});
}
function voltar(){
window.location.href="admin.html";
}
</script>
</body>
</html>
