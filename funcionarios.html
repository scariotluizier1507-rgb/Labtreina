<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TREINACCGL - Funcionários</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="conteudo">


<h1>👥 Funcionários</h1>

<p>
Cadastro e controle da equipe do laboratório
</p>



<div class="card">


<h2>Novo Funcionário</h2>


<input id="nome" placeholder="Nome completo">


<input id="matricula" placeholder="Matrícula">


<input id="cargo" placeholder="Cargo">


<select id="turno">

<option value="1">
Turno A
</option>

<option value="2">
Turno B
</option>

<option value="3">
Turno C
</option>

</select>



<button onclick="cadastrarFuncionario()">

Cadastrar

</button>



</div>





<div class="card">


<h2>Equipe cadastrada</h2>


<table border="1" width="100%">


<thead>

<tr>

<th>Nome</th>

<th>Cargo</th>

<th>Turno</th>

</tr>

</thead>


<tbody id="listaFuncionarios">


</tbody>


</table>


</div>



</div>



<script src="js/funcionarios.js"></script>


</body>


</html>
