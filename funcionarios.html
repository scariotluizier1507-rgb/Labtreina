<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TREINACCGL - Funcionários</title>


<style>

body{

font-family:Arial, sans-serif;
background:#f4f6f8;
margin:0;

}


header{

background:#003b5c;
color:white;
padding:20px;
text-align:center;

}


.container{

max-width:1100px;
margin:30px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 3px 15px rgba(0,0,0,0.15);

}


h2{

color:#003b5c;

}



.formulario{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

}



input,select{

padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;

}



button{

margin-top:20px;
background:#0077b6;
color:white;
border:none;
padding:12px 25px;
border-radius:6px;
cursor:pointer;

}



button:hover{

background:#005f8f;

}



table{

width:100%;
border-collapse:collapse;
margin-top:30px;

}



th{

background:#003b5c;
color:white;
padding:12px;

}



td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


</style>


</head>



<body>



<header>

<h1>TREINACCGL</h1>

<p>Cadastro de Funcionários</p>

</header>




<div class="container">



<h2>Novo Funcionário</h2>



<div class="formulario">



<input 
id="nome" 
placeholder="Nome completo">



<input 
id="matricula" 
placeholder="Matrícula">



<input 
id="cargo" 
placeholder="Cargo">





<select id="setor">


<option value="">
Selecione o setor
</option>


<option value="1">
Laboratório de Leite
</option>


</select>






<select id="turno">


<option value="">
Selecione o turno
</option>


<option value="1">
Turno A
</option>


<option value="2">
Turno B
</option>


<option value="3">
Turno C
</option>



</select>




</div>



<button onclick="salvarFuncionario()">

Salvar Funcionário

</button>






<h2>Funcionários cadastrados</h2>



<table>



<thead>


<tr>

<th>Nome</th>

<th>Matrícula</th>

<th>Cargo</th>

<th>Setor</th>

<th>Turno</th>

<th>Status</th>


</tr>


</thead>




<tbody id="listaFuncionarios">


</tbody>




</table>



</div>




<script src="js/funcionarios.js"></script>



</body>


</html>
