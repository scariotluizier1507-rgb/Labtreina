<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TREINACCGL - Dashboard</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="dashboard">


<header>

<h1>TREINACCGL</h1>

<p id="boasVindas">
Carregando...
</p>

</header>


<section class="cards">


<div class="card">
<h3>👥 Funcionários</h3>
<p>18 cadastrados</p>
</div>


<div class="card">
<h3>📚 Treinamentos</h3>
<p>42 ativos</p>
</div>


<div class="card">
<h3>📄 Documentos</h3>
<p>PCC | ICOQ | IT</p>
</div>


<div class="card">
<h3>🏆 Certificados</h3>
<p>320 emitidos</p>
</div>


</section>



<section class="turnos">


<h2>Controle por Turno</h2>


<div class="turno">
<h3>🌅 Turno A</h3>
<p>Conformidade: 100%</p>
</div>


<div class="turno">
<h3>🌇 Turno B</h3>
<p>Conformidade: 94%</p>
</div>


<div class="turno">
<h3>🌙 Turno C</h3>
<p>Conformidade: 86%</p>
</div>


</section>



<nav>

<button>👥 Funcionários</button>

<button>📚 Treinamentos</button>

<button>📄 Documentos</button>

<button>🏆 Certificados</button>

<button onclick="sair()">
🚪 Sair
</button>


</nav>


</div>


<script>

let usuario = JSON.parse(
localStorage.getItem("usuarioLogado")
);


if(usuario){

document.getElementById("boasVindas").innerHTML =
"Bem-vindo, " + usuario.nome;

}else{

window.location.href="login.html";

}



function sair(){

localStorage.removeItem("usuarioLogado");

window.location.href="login.html";

}


</script>


</body>

</html>
