<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login TREINACCGL</title>
<style>
body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;
background:#f4f8fc;
display:flex;
align-items:center;
justify-content:center;
}
.login{
width:90%;
max-width:380px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 5px 20px #ccd6e0;
text-align:center;
}
.logo{
font-size:38px;
font-weight:bold;
color:#0057b8;
}
.subtitulo{
color:#555;
margin-bottom:25px;
}
input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}
button{
width:100%;
padding:15px;
margin-top:20px;
background:#0057b8;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}
button:hover{
background:#003f87;
}
.mensagem{
margin-top:20px;
font-size:18px;
color:#0057b8;
font-weight:bold;
}
</style>
</head>
<body>
<div class="login">
<div class="logo">
TREINACCGL
</div>
<p class="subtitulo">
Sistema de Gestão de Treinamentos
</p>
<input id="usuario" placeholder="Usuário">
<input id="senha" 
type="password" 
placeholder="Senha">
<button onclick="entrar()">
Entrar
</button>
<div class="mensagem" id="mensagem"></div>
</div>
<script>
function entrar(){
let usuario =
document.getElementById("usuario").value;
let senha =
document.getElementById("senha").value;
if(usuario=="admin" && senha=="1234"){
localStorage.setItem("perfil","gestor");
localStorage.setItem("usuario","Gestor");
document.getElementById("mensagem").innerHTML=
"Bem-vindo ao TREINACCGL, Gestor!";
setTimeout(()=>{
location.href="admin.html";
},1500);
}
else if(usuario=="auxiliar" && senha=="1234"){
localStorage.setItem("perfil","auxiliar");
localStorage.setItem("usuario","Auxiliar");
document.getElementById("mensagem").innerHTML=
"Bem-vindo ao TREINACCGL, Auxiliar!";
setTimeout(()=>{
location.href="index.html";
},1500);
}
else{
document.getElementById("mensagem").innerHTML=
"Usuário ou senha inválidos";
}
}
</script>
</body>
</html>
