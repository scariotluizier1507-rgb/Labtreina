<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login TREINACCGL</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f8fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.login{
background:white;
padding:30px;
border-radius:15px;
width:90%;
max-width:350px;
box-shadow:0 3px 15px #ccc;
text-align:center;
}
h1{
color:#0057b8;
}
input,button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}
button{
background:#0057b8;
color:white;
border:none;
}
</style>
</head>
<body>
<div class="login">
<h1>TREINACCGL</h1>
<p>Acesso ao sistema</p>
<input id="usuario" placeholder="Usuário">
<input id="senha" type="password" placeholder="Senha">
<button onclick="entrar()">
Entrar
</button>
<p id="erro"></p>
</div>
<script>
function entrar(){
let usuario =
document.getElementById("usuario").value;
let senha =
document.getElementById("senha").value;
if(usuario=="admin" && senha=="1234"){
localStorage.setItem("perfil","gestor");
location.href="admin.html";
}
else if(usuario=="auxiliar" && senha=="1234"){
localStorage.setItem("perfil","auxiliar");
location.href="index.html";
}
else{
document.getElementById("erro").innerHTML=
"Usuário ou senha inválidos";
}
}
</script>
</body>
</html>
