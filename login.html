<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREINACCGL - Login</title>
<style>
*{
box-sizing:border-box;
}
body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;
background:#0057b8;
display:flex;
align-items:center;
justify-content:center;
}
.container{
width:90%;
max-width:420px;
}
.logo{
text-align:center;
color:white;
margin-bottom:25px;
}
.logo h1{
font-size:42px;
margin:0;
}
.logo p{
font-size:18px;
}
.login{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
}
.login h2{
text-align:center;
color:#0057b8;
}
.frase{
text-align:center;
color:#555;
font-style:italic;
margin-bottom:25px;
}
input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}
button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
background:#0057b8;
color:white;
font-size:18px;
font-weight:bold;
}
button:hover{
background:#003f87;
}
#mensagem{
text-align:center;
margin-top:15px;
color:#0057b8;
font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<h1>
TREINACCGL
</h1>
<p>
Sistema de Gestão de Treinamentos
</p>
</div>
<div class="login">
<h2>
Acesso ao Sistema
</h2>
<div class="frase">
"Capacitando pessoas.<br>
Controlando conhecimento.<br>
Garantindo qualidade."
</div>
<input id="usuario"
placeholder="Usuário">
<input id="senha"
type="password"
placeholder="Senha">
<button onclick="entrar()">
ENTRAR
</button>
<div id="mensagem"></div>
</div>
</div>
<script>
function entrar(){
let usuario =
document.getElementById("usuario").value;
let senha =
document.getElementById("senha").value;
if(usuario=="admin" && senha=="1234"){
localStorage.setItem("perfil","gestor");
localStorage.setItem("usuario","Gestor");
document.getElementById("mensagem").innerHTML =
"Bem-vindo ao TREINACCGL!";
setTimeout(function(){
window.location.href="admin.html";
},1200);
}
else if(usuario=="auxiliar" && senha=="1234"){
localStorage.setItem("perfil","auxiliar");
localStorage.setItem("usuario","Auxiliar");
document.getElementById("mensagem").innerHTML =
"Bem-vindo ao TREINACCGL!";
setTimeout(function(){
window.location.href="index.html";
},1200);
}
else{
document.getElementById("mensagem").innerHTML =
"Usuário ou senha inválidos";
}
}
</script>
</body>
</html>
