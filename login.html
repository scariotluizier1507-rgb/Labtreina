<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TREINACCGL - Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>TREINACCGL</h1>
        <p>Sistema de Gestão de Treinamentos Laboratoriais</p>
    </div>


    <div class="login-box">

        <h2>Acesso ao Sistema</h2>

        <input 
        type="text" 
        id="usuario" 
        placeholder="Usuário">


        <input 
        type="password" 
        id="senha" 
        placeholder="Senha">


        <button onclick="login()">
            ENTRAR
        </button>


        <p id="mensagem"></p>

    </div>


    <footer>
        TREINACCGL © 2026
    </footer>

</div>


<script src="js/login.js"></script>

</body>
</html>
