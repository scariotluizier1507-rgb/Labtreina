<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Gestor - TREINACCGL</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f8fc;
padding:20px;
}
.container{
max-width:1000px;
margin:auto;
}
header{
background:#0057b8;
color:white;
padding:25px;
border-radius:15px;
text-align:center;
}
.card{
background:white;
padding:20px;
margin-top:15px;
border-radius:15px;
box-shadow:0 3px 10px #d0d7e2;
}
.numero{
font-size:35px;
font-weight:bold;
color:#0057b8;
}
h2{
color:#0057b8;
}
.item{
background:#eef5fc;
padding:12px;
margin-top:10px;
border-radius:8px;
}
button{
width:100%;
padding:15px;
margin-top:15px;
background:#0057b8;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📊 Painel do Gestor</h1>
<p>TREINACCGL - Gestão de Treinamentos</p>
</header>
<div class="card">
<h2>Indicadores</h2>
<p>
👥 Funcionários cadastrados:
</p>
<div class="numero" id="funcionarios">
0
</div>
<p>
📚 Treinamentos:
</p>
<div class="numero" id="treinamentos">
0
</div>
<p>
📝 Avaliações realizadas:
</p>
<div class="numero" id="avaliacoes">
0
</div>
</div>
<div class="card">
<h2>📚 Treinamentos cadastrados</h2>
<div id="listaTreinamentos"></div>
</div>
<div class="card">
<h2>📝 Resultados das avaliações</h2>
<div id="listaAvaliacoes"></div>
</div>
<button onclick="location.href='index.html'">
Voltar ao início
</button>
</div>
<script>
let funcionarios =
JSON.parse(localStorage.getItem("funcionarios")) || [];
let treinamentos =
JSON.parse(localStorage.getItem("treinamentos")) || [];
let avaliacoes =
JSON.parse(localStorage.getItem("avaliacoes")) || [];
document.getElementById("funcionarios").innerHTML =
funcionarios.length;
document.getElementById("treinamentos").innerHTML =
treinamentos.length;
document.getElementById("avaliacoes").innerHTML =
avaliacoes.length;
let listaT =
document.getElementById("listaTreinamentos");
treinamentos.forEach(t=>{
listaT.innerHTML += `
<div class="item">
<b>${t.nome}</b><br>
Tipo: ${t.categoria}<br>
Versão: ${t.versao}<br>
Responsável: ${t.responsavel}
</div>
`;
});
let listaA =
document.getElementById("listaAvaliacoes");
avaliacoes.forEach(a=>{
listaA.innerHTML += `
<div class="item">
<b>${a.funcionario}</b><br>
Treinamento: ${a.treinamento}<br>
Nota: ${a.nota}%<br>
Status: ${a.status}
</div>
`;
});
</script>
</body>
</html>
