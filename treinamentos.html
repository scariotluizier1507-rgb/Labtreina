<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamentos - TREINACCGL</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    margin: 0;
}
header {
    background: #006633;
    color: white;
    text-align: center;
    padding: 20px;
}
.container {
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}
button {
    background: #006633;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}
th, td {
    border: 1px solid #ddd;
    padding: 10px;
}
</style>
</head>
<body>
<header>
<h1>TREINACCGL</h1>
<p>Cadastro de Treinamentos</p>
</header>
<div class="container">
<div class="card">
<h2>Novo Treinamento</h2>
<input id="nomeTreinamento" placeholder="Nome do treinamento">
<input id="codigo" placeholder="Código (POP, IT, PCC)">
<input id="versao" placeholder="Versão do documento">
<input id="responsavel" placeholder="Responsável pelo treinamento">
<select id="periodicidade">
<option value="">Periodicidade</option>
<option>Anual</option>
<option>Semestral</option>
<option>Quando houver alteração</option>
</select>
<button onclick="cadastrarTreinamento()">

Cadastrar treinamento

</button>
</div>
<div class="card">
<h2>Treinamentos cadastrados</h2>
<table>
<thead>
<tr>
<th>Treinamento</th>
<th>Código</th>
<th>Versão</th>
<th>Responsável</th>
<th>Periodicidade</th>
</tr>
</thead>
<tbody id="listaTreinamentos">
</tbody>
</table>
</div>
<button onclick="voltar()">

Voltar ao painel

</button>
</div>
<script>
let treinamentos = JSON.parse(localStorage.getItem("treinamentos")) || [];
mostrarTreinamentos();
function cadastrarTreinamento(){
let nome = document.getElementById("nomeTreinamento").value;
let codigo = document.getElementById("codigo").value;
let versao = document.getElementById("versao").value;
let responsavel = document.getElementById("responsavel").value;
let periodicidade = document.getElementById("periodicidade").value;
if(!nome || !codigo || !versao || !responsavel || !periodicidade){
alert("Preencha todos os campos!");
return;
}
treinamentos.push({
nome,
codigo,
versao,
responsavel,
periodicidade
});
localStorage.setItem(
"treinamentos",
JSON.stringify(treinamentos)
);
mostrarTreinamentos();
alert("Treinamento cadastrado com sucesso!");
document.getElementById("nomeTreinamento").value="";
document.getElementById("codigo").value="";
document.getElementById("versao").value="";
document.getElementById("responsavel").value="";
document.getElementById("periodicidade").value="";
}
function mostrarTreinamentos(){
let tabela = document.getElementById("listaTreinamentos");
tabela.innerHTML="";
treinamentos.forEach(function(t){
let linha = tabela.insertRow();
linha.insertCell(0).innerHTML=t.nome;
linha.insertCell(1).innerHTML=t.codigo;
linha.insertCell(2).innerHTML=t.versao;
linha.insertCell(3).innerHTML=t.responsavel;
linha.insertCell(4).innerHTML=t.periodicidade;
});
}
function voltar(){
window.location.href="admin.html";
}
</script>
</body>
</html>
